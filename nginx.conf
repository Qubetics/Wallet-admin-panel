# Send HSTS only when TLS was terminated in front of this container
map $http_x_forwarded_proto $hsts_header {
  default "";
  https   "max-age=31536000; includeSubDomains";
}

server {
  listen 8080;
  server_name _;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  # TLS is terminated by the load balancer / ingress in front of this container,
  # which sets X-Forwarded-Proto. Plain-HTTP requests are redirected to HTTPS.
  # Direct access to the container (no header) is unaffected.
  if ($http_x_forwarded_proto = "http") {
    return 301 https://$host$request_uri;
  }

  include /etc/nginx/snippets/security-headers.conf;

  # Single-page app: send unknown paths to index.html so client-side routes survive a refresh
  location / {
    try_files $uri /index.html;
  }

  # Hashed build assets can be cached for a long time
  location /static/ {
    include /etc/nginx/snippets/security-headers.conf;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
